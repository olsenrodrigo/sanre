<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--sanre:head-->
    <title>Óticas Sanrê | Óculos de sol, de grau e EPI em Cravinhos e Ribeirão Preto</title>
    <meta
      name="description"
      content="Ótica em Cravinhos desde 2004 e em Ribeirão Preto na PB Arts Gallery. Ray-Ban, Oakley, Prada, Gucci, Tom Ford e mais, com provador virtual, lentes de grau com receita e retirada na loja."
    />
    <meta property="og:site_name" content="Óticas Sanrê" />
    <meta property="og:title" content="Óticas Sanrê | Óculos de sol, de grau e EPI" />
    <meta
      property="og:description"
      content="Cravinhos desde 2004 e Ribeirão Preto na PB Arts Gallery. Provador virtual, lentes de grau com receita e retirada na loja."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:image" content="/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-image.jpg" />
    <!--/sanre:head-->

    <meta name="theme-color" content="#141414" />
    <!--
      O servidor preenche #root com o conteúdo da rota em HTML (para buscador e
      IA que não executam JavaScript). Com JavaScript, o React assume a página e
      esse bloco não aparece — sem "flash" de conteúdo cru.
    -->
    <script>document.documentElement.classList.add("js")</script>
    <style>.js [data-ssr]{display:none}</style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!--
      Tipografia: Montserrat é a fonte oficial do manual da marca (títulos e
      rótulos); DM Sans no texto corrido. A logomarca é SVG, não depende daqui.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Montserrat:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"><!--sanre:ssr--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
